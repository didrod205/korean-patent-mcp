name: Publish to npm

# GitHub Release를 만들면 배포된다. 수동 npm publish 대신 이 경로를 쓰면
# "커밋은 했는데 배포는 그 이전 상태" 같은 사고가 구조적으로 막힌다.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing(OIDC)은 최신 npm CLI에서만 동작한다.
      # 러너에 실린 npm이 구버전이면 토큰을 찾다가 실패한다.
      - name: Trusted Publishing을 지원하는 npm CLI
        run: npm install --global --ignore-scripts npm@^11

      # 릴리스 태그와 package.json 버전이 다르면 여기서 멈춘다.
      # 1.0.3 사고(로컬은 1.0.5인데 1.0.3이 올라감)를 막는 게이트다.
      - name: 릴리스 태그와 package.json 버전 일치 확인
        run: |
          node -e '
            const v = require("./package.json").version;
            const tag = process.env.GITHUB_REF_NAME;
            if (![v, `v${v}`].includes(tag)) {
              throw new Error(`릴리스 태그 ${tag} 가 package.json 버전 ${v} 과 다릅니다.`);
            }
            console.log(`태그 ${tag} = 버전 ${v} 확인`);
          '

      - name: Install
        run: npm ci --ignore-scripts

      - name: 배포 전 전체 검증
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run verify:package

      # audit 은 두 가지 이유로 실패한다: (1) 취약점이 있다 (2) 엔드포인트가 죽었다.
      # 둘을 구분하지 않으면 네트워크 한 번 튀는 것으로 릴리스가 막힌다.
      # 반대로 통째로 무시하면 감시 장치가 아니라 장식이 된다.
      - name: 의존성 취약점 점검
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              echo "취약점 없음"
              exit 0
            fi
            # 취약점이 실제로 보고됐는지 확인 — 보고됐으면 재시도 없이 막는다
            if npm audit --omit=dev --json 2>/dev/null | grep -q '"severity"'; then
              echo "::error::high 이상 취약점이 있습니다. 배포를 막습니다."
              npm audit --omit=dev --audit-level=high || true
              exit 1
            fi
            echo "audit 엔드포인트 응답 없음 (시도 $attempt/3)"
            sleep 10
          done
          echo "::warning::npm audit 엔드포인트에 접근하지 못해 취약점 점검을 건너뜁니다. 배포는 계속합니다."

      # 이미 올라간 버전이면 조용히 넘어간다.
      # 손으로 npm publish 한 뒤 기록용으로 릴리스를 만드는 경우가 있는데,
      # 그때마다 워크플로가 빨개지면 진짜 실패를 못 알아보게 된다.
      - name: 이미 배포된 버전인지 확인
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "korean-patent-mcp@$V" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$V 는 이미 npm에 있습니다. 배포를 건너뜁니다."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # 배포 인증은 Trusted Publishing(OIDC)으로 한다. 시크릿이 없다.
      #
      # 왜 토큰을 안 쓰는가: npm granular token은 최대 90일이라 분기마다 만료되고,
      # 그때마다 배포가 조용히 깨진다. 클래식 토큰은 폐지 수순이다.
      # OIDC는 GitHub가 이 워크플로 실행에 대해 발급하는 단기 증명을 쓰므로
      # 갱신할 것도, 유출될 장기 비밀도 없다.
      #
      # 설정(최초 1회): npmjs.com > 패키지 > Settings > Trusted Publisher 에
      #   Repository: didrod205/korean-patent-mcp
      #   Workflow:   publish.yml
      # 를 등록한다. 등록 전까지는 이 단계가 실패하며, 로컬 npm publish 로 배포하면 된다.
      #
      # --provenance: 이 tarball이 이 저장소의 이 커밋에서 빌드됐다는 증명이 붙는다.
      - name: Publish (Trusted Publishing)
        if: steps.check.outputs.already == 'false'
        run: npm publish --provenance --access public
