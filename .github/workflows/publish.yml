name: Publish to npm

# GitHub Release를 만들면 배포된다. 수동 npm publish 대신 이 경로를 쓰면
# "커밋은 했는데 배포는 그 이전 상태" 같은 사고가 구조적으로 막힌다.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # 릴리스 태그와 package.json 버전이 다르면 여기서 멈춘다.
      # 1.0.3 사고(로컬은 1.0.5인데 1.0.3이 올라감)를 막는 게이트다.
      - name: 릴리스 태그와 package.json 버전 일치 확인
        run: |
          node -e '
            const v = require("./package.json").version;
            const tag = process.env.GITHUB_REF_NAME;
            if (![v, `v${v}`].includes(tag)) {
              throw new Error(`릴리스 태그 ${tag} 가 package.json 버전 ${v} 과 다릅니다.`);
            }
            console.log(`태그 ${tag} = 버전 ${v} 확인`);
          '

      - name: Install
        run: npm ci --ignore-scripts

      - name: 배포 전 전체 검증
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run verify:package
          npm audit --omit=dev --audit-level=high

      # 이미 올라간 버전이면 조용히 넘어간다.
      # 손으로 npm publish 한 뒤 기록용으로 릴리스를 만드는 경우가 있는데,
      # 그때마다 워크플로가 빨개지면 진짜 실패를 못 알아보게 된다.
      - name: 이미 배포된 버전인지 확인
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "korean-patent-mcp@$V" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$V 는 이미 npm에 있습니다. 배포를 건너뜁니다."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # 인증 수단이 없으면 실패시키지 않고 명확히 알린다.
      # NPM_TOKEN 없이 릴리스를 만든 사람에게 "왜 안 올라갔는지"를 로그로 남긴다.
      - name: 인증 수단 확인
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN 시크릿이 없어 자동 배포를 건너뜁니다. \
            npmjs.com에서 Automation 토큰을 만들어 gh secret set NPM_TOKEN 으로 넣거나, \
            Trusted Publishing을 설정하세요. 그때까지는 로컬에서 npm publish 하시면 됩니다."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      # provenance: 이 패키지가 이 저장소의 이 커밋에서 빌드됐다는 증명이 붙는다.
      # NPM_TOKEN 대신 npm Trusted Publishing을 쓰려면 npmjs.com 패키지 설정에서
      # 이 저장소와 워크플로 파일명을 등록하면 된다(그 경우 NODE_AUTH_TOKEN 불필요).
      - name: Publish
        if: steps.check.outputs.already == 'false' && steps.auth.outputs.have == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
